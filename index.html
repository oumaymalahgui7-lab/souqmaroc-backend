// Component imports









function App() {
  // Global configuration states
  const [language, setLanguage] = useState<Language>('ar');
  const [darkMode, setDarkMode] = useState<boolean>(false);
  const [isLoggedIn, setIsLoggedIn] = useState<boolean>(false);
  const [userRole, setUserRole] = useState<AccountType>('user');

  // Database core states
  const [ads, setAds] = useState<Advertisement[]>(initialAds);
  const [favorites, setFavorites] = useState<string[]>(['ad-3']);
  const [threads, setThreads] = useState<ChatThread[]>(initialThreads);
  const [notifications, setNotifications] = useState<AppNotification[]>(initialNotifications);

  // UI Flow navigation states
  const [activeTab, setActiveTab] = useState<string>('home');
  const [selectedAd, setSelectedAd] = useState<Advertisement | null>(null);
  const [activeThreadId, setActiveThreadId] = useState<string | null>(null);
  
  // Search & Filters state
  const [searchFilters, setSearchFilters] = useState<SearchFilters>({
    keyword: '',
    categoryId: 'all',
    city: 'all',
    minPrice: '',
    maxPrice: '',
    condition: 'all',
    tier: 'all',
    sortBy: 'recent'
  });
  const [showFiltersPanel, setShowFiltersPanel] = useState(false);

  // Authentication simulator states
  const [authPhone, setAuthPhone] = useState('');
  const [showOtpScreen, setShowOtpScreen] = useState(false);
  const [otpCode, setOtpCode] = useState('');

  const t = translations[language];

  // Sync Dark Mode state with DOM
  useEffect(() => {
    if (darkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [darkMode]);

  // Handle toggling favorites
  const handleToggleFavorite = (adId: string, e: React.MouseEvent) => {
    e.stopPropagation();
    setFavorites(prev => 
      prev.includes(adId) ? prev.filter(id => id !== adId) : [...prev, adId]
    );
  };

  // Switch to specific Chat Thread, creating one if not existing
  const handleStartChat = (ad: Advertisement) => {
    const existingThread = threads.find(t => t.adId === ad.id && t.sellerId === ad.sellerId);
    
    if (existingThread) {
      setActiveThreadId(existingThread.id);
    } else {
      // Create a fresh message thread
      const newThread: ChatThread = {
        id: `thread-${Date.now()}`,
        adId: ad.id,
        adTitle: ad.title,
        adPrice: ad.price,
        adImage: ad.images[0],
        buyerId: 'user-current',
        buyerName: 'Maryam El Faly',
        sellerId: ad.sellerId,
        sellerName: ad.sellerName,
        lastMessage: 'Salam, is this still available?',
        lastTimestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        messages: [
          {
            id: `msg-init-${Date.now()}`,
            senderId: 'user-current',
            text: `Salam Alaykoum, I am interested in your listing: "${ad.title}". Is it still available?`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            read: true
          }
        ]
      };

      setThreads(prev => [newThread, ...prev]);
      setActiveThreadId(newThread.id);
    }

    setSelectedAd(null);
    setActiveTab('chat');
  };

  // Create new advertisement from PostAd Form
  const handlePublishAd = (newAd: Advertisement) => {
    setAds(prev => [newAd, ...prev]);
    
    // Add custom notification acknowledging successful ad publish
    const newNotif: AppNotification = {
      id: `notif-${Date.now()}`,
      titleAr: 'تمت الموافقة ونشر إعلانك بنجاح! 🚀',
      titleFr: 'Annonce publiée et approuvée ! 🚀',
      titleEn: 'Ad published and approved successfully! 🚀',
      bodyAr: `إعلانك "${newAd.title}" نشط الآن في مدينة ${newAd.city}.`,
      bodyFr: `Votre annonce "${newAd.title}" est active à ${newAd.city}.`,
      bodyEn: `Your ad "${newAd.title}" is active in ${newAd.city}.`,
      type: 'ad_status',
      createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      read: false,
      adId: newAd.id
    };

    setNotifications(prev => [newNotif, ...prev]);
    setActiveTab('home');
  };

  // Mark all notifications as read
  const markNotificationsAsRead = () => {
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
  };

  // Apply filtering rules to advertisements list
  const filteredAds = ads.filter(ad => {
    const matchKeyword = !searchFilters.keyword || 
      ad.title.toLowerCase().includes(searchFilters.keyword.toLowerCase()) ||
      ad.description.toLowerCase().includes(searchFilters.keyword.toLowerCase());
    
    const matchCategory = searchFilters.categoryId === 'all' || ad.categoryId === searchFilters.categoryId;
    const matchCity = searchFilters.city === 'all' || ad.city === searchFilters.city;
    const matchMinPrice = searchFilters.minPrice === '' || ad.price >= Number(searchFilters.minPrice);
    const matchMaxPrice = searchFilters.maxPrice === '' || ad.price <= Number(searchFilters.maxPrice);
    const matchCondition = searchFilters.condition === 'all' || ad.condition === searchFilters.condition;
    const matchTier = searchFilters.tier === 'all' || ad.tier === searchFilters.tier;

    return matchKeyword && matchCategory && matchCity && matchMinPrice && matchMaxPrice && matchCondition && matchTier;
  });

  // Sort filtered ads
  const sortedAds = [...filteredAds].sort((a, b) => {
    if (searchFilters.sortBy === 'price_asc') return a.price - b.price;
    if (searchFilters.sortBy === 'price_desc') return b.price - a.price;
    if (searchFilters.sortBy === 'popular') return b.views - a.views;
    return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime(); // recent default
  });

  // Split sorted ads into different sections on Home Tab
  const goldAds = sortedAds.filter(ad => ad.tier === 'gold');
  const silverAds = sortedAds.filter(ad => ad.tier === 'silver');
  const normalAds = sortedAds.filter(ad => ad.tier === 'normal');

  // Unread chats count
  const unreadChatsCount = threads.reduce((acc, th) => {
    return acc + th.messages.filter(m => m.senderId !== 'user-current' && !m.read).length;
  }, 0);

  // Phone number login: create a login request in Firestore, then show OTP entry
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState('');

  const handleLoginSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    setAuthError('');
    setAuthLoading(true);
    const fullPhone = '212' + authPhone.replace(/\s/g, '');
    try {
      const res = await fetch('https://souqmaroc-backend.vercel.app/api/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: fullPhone })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        setShowOtpScreen(true);
      } else {
        setAuthError(data.error || 'تعذر إرسال الرمز، حاول مجدداً');
      }
    } catch (err) {
      setAuthError('تعذر إرسال الطلب، تأكد من الاتصال بالإنترنت وحاول مجدداً');
      console.error(err);
    }
    setAuthLoading(false);
  };

  const handleOtpVerify = async (e: React.FormEvent) => {
    e.preventDefault();
    setAuthError('');
    setAuthLoading(true);
    const fullPhone = '212' + authPhone.replace(/\s/g, '');
    try {
      const res = await fetch('https://souqmaroc-backend.vercel.app/api/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: fullPhone, code: otpCode.trim() })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        setShowOtpScreen(false);
        setIsLoggedIn(true);
      } else {
        setAuthError(data.error || 'الرمز غير صحيح، حاول مرة أخرى');
      }
    } catch (err) {
      setAuthError('حدث خطأ أثناء التحقق، حاول مجدداً');
      console.error(err);
    }
    setAuthLoading(false);
  };

  return (
    <div 
      dir={language === 'ar' ? 'rtl' : 'ltr'} 
      className="min-h-screen bg-slate-50 dark:bg-zinc-950 text-gray-800 dark:text-gray-150 transition-colors duration-300 font-sans"
    >
      
      {/* AUTHENTICATION SIMULATOR SCREEN OVERLAY (Shown first unless logged in) */}
      {!isLoggedIn ? (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-tr from-slate-100 to-slate-200 dark:from-zinc-950 dark:to-zinc-900 relative">
          
          {/* Language Selector on Login Screen */}
          <div className="absolute top-4 right-4 flex gap-1 bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 rounded-xl p-1 shadow-sm">
            {(['ar', 'fr'] as Language[]).map(l => (
              <button 
                key={l} 
                onClick={() => setLanguage(l)}
                className={`px-3 py-1 rounded-lg text-xs font-bold uppercase transition-colors ${language === l ? 'bg-emerald-600 text-white' : 'text-gray-500'}`}
              >
                {l}
              </button>
            ))}
          </div>

          <div className="w-full max-w-md bg-white dark:bg-zinc-950 rounded-3xl shadow-2xl border border-gray-100 dark:border-zinc-900 overflow-hidden p-6 sm:p-8 animate-in fade-in zoom-in-95 duration-300 space-y-6">
            
            {/* Logo */}
            <div className="text-center space-y-1.5">
              <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-amber-500 flex items-center justify-center text-white font-black text-3xl shadow-md shadow-emerald-500/10 mx-auto">
                S
              </div>
              <h1 className="text-2xl font-black bg-gradient-to-r from-emerald-600 to-amber-500 bg-clip-text text-transparent">
                {t.app_name}
              </h1>
              <p className="text-xs text-gray-500 dark:text-zinc-400 font-semibold max-w-xs mx-auto leading-normal">
                {t.app_tagline}
              </p>
            </div>

            {/* Login Form: Phone-only authentication */}
            {!showOtpScreen ? (
              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div className="text-left">
                  <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">{t.auth_phone}</label>
                  <div className="relative">
                    <span className="absolute right-4 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-400">🇲🇦 +212</span>
                    <input
                      required
                      type="tel"
                      value={authPhone}
                      onChange={(e) => setAuthPhone(e.target.value)}
                      placeholder="6 12 34 56 78"
                      className="w-full pr-20 pl-4 py-3 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-xs focus:border-emerald-500 outline-none text-right"
                      dir="ltr"
                    />
                  </div>
                  <p className="text-[10px] text-gray-400 mt-1.5">سنرسل لك رمز تحقق مكوّن من أرقام عبر رسالة نصية SMS</p>
                </div>

                {authError && (
                  <p className="text-[11px] text-red-600 font-bold text-center">{authError}</p>
                )}

                {/* Login Button */}
                <button
                  type="submit"
                  disabled={authLoading}
                  className="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-lg shadow-emerald-500/10 transition-all active:scale-98 disabled:opacity-60"
                >
                  {authLoading ? 'جاري الإرسال...' : 'إرسال رمز التحقق'}
                </button>
              </form>
            ) : (
              /* OTP verification Code Screen */
              <form onSubmit={handleOtpVerify} className="space-y-4 animate-in slide-in-from-bottom-2 duration-300">
                <div className="text-center space-y-2">
                  <p className="text-xs text-gray-500">
                    تم إرسال رمز التحقق عبر SMS إلى الرقم <span className="font-bold text-zinc-900 dark:text-white" dir="ltr">+212 {authPhone}</span>
                  </p>
                </div>

                <div className="text-left">
                  <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">أدخل رمز التحقق</label>
                  <input
                    required
                    type="text"
                    maxLength={6}
                    value={otpCode}
                    onChange={(e) => setOtpCode(e.target.value)}
                    placeholder="0000"
                    className="w-full px-4 py-3 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-xs focus:border-emerald-500 outline-none text-center font-black tracking-widest text-lg"
                  />
                </div>

                {authError && (
                  <p className="text-[11px] text-red-600 font-bold text-center">{authError}</p>
                )}

                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => { setShowOtpScreen(false); setAuthError(''); }}
                    className="flex-1 py-3 rounded-xl border border-gray-200 text-gray-600 text-xs font-bold hover:bg-gray-50"
                  >
                    رجوع
                  </button>
                  <button
                    type="submit"
                    disabled={authLoading}
                    className="flex-1 py-3 rounded-xl bg-emerald-600 text-white text-xs font-black shadow-md hover:bg-emerald-700 disabled:opacity-60"
                  >
                    {authLoading ? 'جاري التحقق...' : 'تأكيد الرمز'}
                  </button>
                </div>
              </form>
            )}

            {/* Social Logins */}
            <div className="space-y-3">
              <div className="relative flex py-2 items-center">
                <div className="flex-grow border-t border-gray-100 dark:border-zinc-900" />
                <span className="flex-shrink mx-4 text-[9px] font-black text-gray-400 uppercase tracking-widest">{t.auth_login_social}</span>
                <div className="flex-grow border-t border-gray-100 dark:border-zinc-900" />
              </div>

              <div className="grid grid-cols-3 gap-2">
                <button onClick={() => setIsLoggedIn(true)} className="py-2 rounded-xl border border-gray-100 dark:border-zinc-900 bg-gray-50/50 dark:bg-zinc-900/40 hover:bg-gray-100 text-xs font-bold flex items-center justify-center gap-1">
                  <span>🌐</span> <span className="text-[10px]">Google</span>
                </button>
                <button onClick={() => setIsLoggedIn(true)} className="py-2 rounded-xl border border-gray-100 dark:border-zinc-900 bg-gray-50/50 dark:bg-zinc-900/40 hover:bg-gray-100 text-xs font-bold flex items-center justify-center gap-1">
                  <span>🍎</span> <span className="text-[10px]">Apple</span>
                </button>
                <button onClick={() => setIsLoggedIn(true)} className="py-2 rounded-xl border border-gray-100 dark:border-zinc-900 bg-gray-50/50 dark:bg-zinc-900/40 hover:bg-gray-100 text-xs font-bold flex items-center justify-center gap-1">
                  <span>👥</span> <span className="text-[10px]">Facebook</span>
                </button>
              </div>
            </div>

            {/* Instant Demo Bypass */}
            <button
              onClick={() => {
                setIsLoggedIn(true);
                setUserRole('admin'); // Pro admin layout straight away!
              }}
              className="w-full py-2.5 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-500/20 text-xs font-black flex items-center justify-center gap-1.5 transition-all"
            >
              <span>✨</span>
              <span>Quick Demo Bypass (Enter as Admin)</span>
            </button>

          </div>

        </div>
      ) : (
        /* CORE APPLICATION LAYOUT */
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* Main Navigation Bar */}
          <Navbar 
            currentLanguage={language}
            setLanguage={setLanguage}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            userRole={userRole}
            setUserRole={setUserRole}
            notifications={notifications}
            markNotificationsAsRead={markNotificationsAsRead}
            unreadChatsCount={unreadChatsCount}
          />

          {/* Main Body Content Frame */}
          <main className="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
            
            {/* TAB 1: Home Directory Browse */}
            {activeTab === 'home' && (
              <div className="space-y-6 animate-in fade-in duration-300">
                
                {/* HERO PROMOTIONAL BLOCK WITH SEARCH BAR */}
                <div className="rounded-3xl bg-gradient-to-tr from-emerald-950 via-emerald-800 to-teal-900 text-white p-6 sm:p-10 relative overflow-hidden shadow-lg border border-emerald-800/20">
                  <div className="absolute inset-0 opacity-10" style={{ backgroundSize: '20px 20px', backgroundImage: 'radial-gradient(circle, #fff 1px, transparent 1px)' }} />
                  
                  <div className="relative z-10 max-w-2xl space-y-4">
                    <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-black uppercase tracking-wider">
                      <Sparkles className="w-3.5 h-3.5 animate-pulse" />
                      Premium Moroccan E-Commerce Portal
                    </span>
                    <h2 className="text-2xl sm:text-4xl font-black leading-tight text-white">
                      {t.app_tagline}
                    </h2>
                    <p className="text-xs sm:text-sm text-emerald-100/80 leading-normal">
                      Connecting Casablanca, Rabat, Marrakech, Tangier, and all of Morocco. Fully secure trading with verified pro members.
                    </p>

                    {/* Integrated search bar widget */}
                    <div className="flex flex-col sm:flex-row items-center gap-2 pt-2">
                      <div className="relative w-full">
                        <input
                          type="text"
                          value={searchFilters.keyword}
                          onChange={(e) => setSearchFilters({ ...searchFilters, keyword: e.target.value })}
                          placeholder={t.search_placeholder}
                          className="w-full pl-12 pr-4 py-3.5 rounded-2xl bg-white text-zinc-900 text-xs sm:text-sm placeholder-gray-400 outline-none focus:ring-2 focus:ring-amber-500 font-medium"
                        />
                        <Search className="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" />
                      </div>

                      <div className="flex items-center gap-2 w-full sm:w-auto">
                        {/* City Fast select */}
                        <div className="w-full sm:w-48">
                          <CitySelector
                            value={searchFilters.city}
                            onChange={(val) => setSearchFilters({ ...searchFilters, city: val })}
                            currentLanguage={language}
                            showAllOption={true}
                          />
                        </div>

                        {/* Filters Drawer Toggle */}
                        <button
                          onClick={() => setShowFiltersPanel(!showFiltersPanel)}
                          className={`p-3.5 rounded-2xl border transition-colors flex items-center justify-center ${showFiltersPanel ? 'bg-amber-500 border-amber-500 text-zinc-950' : 'bg-emerald-900 border-emerald-700 text-white hover:bg-emerald-800'}`}
                        >
                          <SlidersHorizontal className="w-5 h-5" />
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* ADVANCED FILTER DRAWER PANEL */}
                {showFiltersPanel && (
                  <div className="p-5 rounded-3xl bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 shadow-md space-y-4 animate-in slide-in-from-top-4 duration-300 text-left">
                    <div className="flex items-center justify-between border-b border-gray-100 dark:border-zinc-800 pb-2.5">
                      <h4 className="text-xs font-black text-gray-400 dark:text-zinc-500 uppercase tracking-wider">
                        {t.filter_title}
                      </h4>
                      <button 
                        onClick={() => setSearchFilters({
                          keyword: '',
                          categoryId: 'all',
                          city: 'all',
                          minPrice: '',
                          maxPrice: '',
                          condition: 'all',
                          tier: 'all',
                          sortBy: 'recent'
                        })}
                        className="text-[10px] text-red-500 hover:underline font-bold"
                      >
                        {t.reset_filters}
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {/* Price Range */}
                      <div className="space-y-1.5">
                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">{t.filter_price_min} - {t.filter_price_max}</label>
                        <div className="flex gap-2">
                          <input 
                            type="number" 
                            placeholder="Min DH" 
                            value={searchFilters.minPrice}
                            onChange={(e) => setSearchFilters({ ...searchFilters, minPrice: e.target.value === '' ? '' : Number(e.target.value) })}
                            className="w-full px-3 py-2 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 text-xs text-gray-800 dark:text-white"
                          />
                          <input 
                            type="number" 
                            placeholder="Max DH" 
                            value={searchFilters.maxPrice}
                            onChange={(e) => setSearchFilters({ ...searchFilters, maxPrice: e.target.value === '' ? '' : Number(e.target.value) })}
                            className="w-full px-3 py-2 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 text-xs text-gray-800 dark:text-white"
                          />
                        </div>
                      </div>

                      {/* Condition Filter */}
                      <div className="space-y-1.5">
                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">{t.field_condition}</label>
                        <select
                          value={searchFilters.condition}
                          onChange={(e) => setSearchFilters({ ...searchFilters, condition: e.target.value })}
                          className="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 text-xs text-gray-800 dark:text-white"
                        >
                          <option value="all">All Conditions</option>
                          <option value="new">{t.cond_new}</option>
                          <option value="like_new">{t.cond_like_new}</option>
                          <option value="good">{t.cond_good}</option>
                        </select>
                      </div>

                      {/* Sorting Order */}
                      <div className="space-y-1.5">
                        <label className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">{t.filter_sort}</label>
                        <select
                          value={searchFilters.sortBy}
                          onChange={(e) => setSearchFilters({ ...searchFilters, sortBy: e.target.value as any })}
                          className="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 text-xs text-gray-800 dark:text-white"
                        >
                          <option value="recent">{t.sort_recent}</option>
                          <option value="price_asc">{t.sort_price_asc}</option>
                          <option value="price_desc">{t.sort_price_desc}</option>
                          <option value="popular">{t.sort_popular}</option>
                        </select>
                      </div>
                    </div>
                  </div>
                )}

                {/* CATEGORIES HORIZONTAL NAVIGATION STRIP */}
                <CategoryGrid 
                  selectedCategory={searchFilters.categoryId}
                  setSelectedCategory={(cat) => setSearchFilters({ ...searchFilters, categoryId: cat })}
                  currentLanguage={language}
                />

                {/* HIGHLIGHTED GOLDEN ADS CAROUSEL / BENTO GRID */}
                {goldAds.length > 0 && (
                  <div className="space-y-3.5">
                    <div className="flex items-center justify-between">
                      <h3 className="text-md sm:text-lg font-black text-gray-900 dark:text-white flex items-center gap-1.5 uppercase tracking-wider">
                        <Sparkles className="w-5 h-5 text-amber-500 animate-spin" />
                        {t.sec_featured}
                      </h3>
                      <span className="text-[10px] bg-amber-500/10 text-amber-600 dark:text-amber-400 font-extrabold px-2.5 py-1 rounded-full uppercase">
                        Premium Golden Placement
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                      {goldAds.map((ad) => (
                        <AdCard 
                          key={ad.id}
                          ad={ad}
                          currentLanguage={language}
                          onSelect={setSelectedAd}
                          onToggleFavorite={handleToggleFavorite}
                          isFavorited={favorites.includes(ad.id)}
                        />
                      ))}
                    </div>
                  </div>
                )}

                {/* REGULAR AND LATEST ADS SECTIONS */}
                <div className="space-y-4 pt-4 border-t border-gray-100 dark:border-zinc-900">
                  <div className="flex items-center justify-between">
                    <h3 className="text-md sm:text-lg font-black text-gray-900 dark:text-white flex items-center gap-1.5 uppercase tracking-wider">
                      <Clock className="w-5 h-5 text-emerald-600" />
                      {t.sec_latest}
                    </h3>
                    <span className="text-xs font-semibold text-gray-400">Showing {sortedAds.length} offers</span>
                  </div>

                  {sortedAds.length === 0 ? (
                    <div className="p-16 text-center rounded-3xl border border-dashed border-gray-200 dark:border-zinc-800 text-gray-400">
                      <span className="text-4xl mb-2 block">🔍</span>
                      <p className="font-bold text-sm text-gray-700 dark:text-zinc-300">No products matched your search filters.</p>
                      <p className="text-xs mt-1">Try resetting the pricing range or choosing a different city.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                      {sortedAds.map((ad) => (
                        <AdCard 
                          key={ad.id}
                          ad={ad}
                          currentLanguage={language}
                          onSelect={setSelectedAd}
                          onToggleFavorite={handleToggleFavorite}
                          isFavorited={favorites.includes(ad.id)}
                        />
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB 2: Instant Chat panel */}
            {activeTab === 'chat' && (
              <ChatWindow 
                currentLanguage={language}
                threads={threads}
                setThreads={setThreads}
                activeThreadId={activeThreadId}
                setActiveThreadId={setActiveThreadId}
              />
            )}

            {/* TAB 3: User Profile */}
            {activeTab === 'profile' && (
              <ProfileView 
                currentLanguage={language}
                ads={ads}
                favorites={favorites}
                onToggleFavorite={handleToggleFavorite}
                onSelectAd={setSelectedAd}
                userRole={userRole}
                setUserRole={setUserRole}
              />
            )}

            {/* TAB 4: Admin desk */}
            {activeTab === 'admin' && userRole === 'admin' && (
              <AdminPanel 
                currentLanguage={language}
                ads={ads}
                setAds={setAds}
                onSelectAd={setSelectedAd}
              />
            )}

          </main>

          {/* MASTER PRODUCT DETAILS MODAL OVERLAY */}
          {selectedAd && (
            <AdDetails 
              ad={selectedAd}
              onClose={() => setSelectedAd(null)}
              currentLanguage={language}
              onToggleFavorite={handleToggleFavorite}
              isFavorited={favorites.includes(selectedAd.id)}
              onStartChat={handleStartChat}
            />
          )}

          {/* MASTER POST ADStep FLOW MODAL OVERLAY */}
          {activeTab === 'post_ad' && (
            <PostAdModal 
              onClose={() => setActiveTab('home')}
              currentLanguage={language}
              onPublish={handlePublishAd}
            />
          )}

          {/* Footer Branding line */}
          <footer className="py-6 border-t border-gray-200 dark:border-zinc-900 bg-white dark:bg-zinc-950 text-center text-xs text-gray-400 dark:text-zinc-500 transition-colors duration-300">
            <div className="max-w-7xl mx-auto px-4 space-y-1">
              <p className="font-extrabold text-gray-500 dark:text-zinc-400">{t.app_name} © 2026. Made with professional care in Morocco.</p>
              <p className="text-[10px]">Material 3 Design • High-Fidelity Marketplace Prototype</p>
            </div>
          </footer>

        </div>
      )}

    </div>
  );
}

window.__App = App;
</script>

  <script type="module">
    async function boot() {
      try {
        const [ReactModule, ReactDOMClient, LucideReact, Babel] = await Promise.all([
          import('https://esm.sh/react@18.2.0'),
          import('https://esm.sh/react-dom@18.2.0/client'),
          import('https://esm.sh/lucide-react@0.263.1'),
          import('https://esm.sh/@babel/standalone@7.24.7?bundle')
        ]);

        const React = ReactModule.default;
        window.React = React;
        window.LucideReact = LucideReact;

        const sourceCode = document.getElementById('app-source').textContent;

        const compiled = Babel.transform(sourceCode, {
          presets: [
            ["typescript", { isTSX: true, allExtensions: true }],
            ["react", { runtime: "classic" }]
          ],
          filename: 'app.tsx'
        }).code;

        const runApp = new Function('React', 'LucideReact', compiled);
        runApp(React, LucideReact);

        const root = ReactDOMClient.createRoot(document.getElementById('root'));
        root.render(React.createElement(window.__App));

        document.getElementById('boot-loader').remove();
      } catch (err) {
        console.error(err);
        document.getElementById('boot-loader').remove();
        const errBox = document.getElementById('boot-error');
        errBox.style.display = 'block';
        errBox.innerHTML = '<h2 style="font-weight:900;margin-bottom:8px;">حدث خطأ أثناء تشغيل التطبيق</h2><p style="margin-bottom:8px;">تأكد من أن جهازك متصل بالإنترنت (يتم تحميل React و Babel من الشبكة).</p><pre style="white-space:pre-wrap;background:#fef2f2;padding:12px;border-radius:8px;font-size:12px;">' + (err && err.stack ? err.stack : String(err)) + '</pre>';
      }
    }
    boot();
  </script>
</body>
</html>

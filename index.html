// ==================== CitySelector ====================



interface CitySelectorProps {
  value: City | 'all';
  onChange: (city: City | 'all') => void;
  currentLanguage: Language;
  showAllOption?: boolean;
  label?: string;
  error?: string;
}

function CitySelector({
  value,
  onChange,
  currentLanguage,
  showAllOption = false,
  label,
  error
}: CitySelectorProps) {
  const [isOpen, setIsOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState('');
  const containerRef = useRef<HTMLDivElement>(null);

  const t = {
    ar: {
      search_placeholder: 'ابحث عن مدينة مغربية...',
      all_morocco: '📍 كل المغرب',
      popular: 'المدن الأكثر بحثاً:',
      empty: 'لم يتم العثور على أي مدينة',
      select: 'اختر المدينة',
    },
    fr: {
      search_placeholder: 'Rechercher une ville marocaine...',
      all_morocco: '📍 Tout le Maroc',
      popular: 'Villes populaires :',
      empty: 'Aucune ville trouvée',
      select: 'Sélectionner la ville',
    },
    en: {
      search_placeholder: 'Search Moroccan city...',
      all_morocco: '📍 All Morocco',
      popular: 'Popular cities:',
      empty: 'No city found',
      select: 'Select city',
    }
  }[currentLanguage] || {
    search_placeholder: 'Rechercher une ville marocaine...',
    all_morocco: '📍 Tout le Maroc',
    popular: 'Villes populaires :',
    empty: 'Aucune ville trouvée',
    select: 'Sélectionner la ville',
  };

  const popularCities: City[] = ['Casablanca', 'Rabat', 'Marrakech', 'Tangier', 'Agadir', 'Fes'];

  // Handle outside click to close dropdown
  useEffect(() => {
    function handleClickOutside(event: MouseEvent) {
      if (containerRef.current && !containerRef.current.contains(event.target as Node)) {
        setIsOpen(false);
      }
    }
    document.addEventListener('mousedown', handleClickOutside);
    return () => document.removeEventListener('mousedown', handleClickOutside);
  }, []);

  const filteredCities = MOROCCAN_CITIES.filter(city => 
    city.toLowerCase().includes(searchQuery.toLowerCase())
  );

  const getCityLabel = (c: City | 'all') => {
    if (c === 'all') return t.all_morocco;
    
    // Arabic translation map for cities if language is 'ar'
    if (currentLanguage === 'ar') {
      const arCities: Record<string, string> = {
        'Casablanca': 'الدار البيضاء',
        'Rabat': 'الرباط',
        'Marrakech': 'مراكش',
        'Tangier': 'طنجة',
        'Agadir': 'أكادير',
        'Fes': 'فاس',
        'Meknes': 'مكناس',
        'Oujda': 'وجدة',
        'Kenitra': 'القنيطرة',
        'Tetouan': 'تطوان',
        'Safi': 'آسفي',
        'El Jadida': 'الجديدة',
        'Nador': 'الناظور',
        'Laayoune': 'العيون',
        'Salé': 'سلا',
        'Mohammedia': 'المحمدية',
        'Dakhla': 'الداخلة',
        'Chefchaouen': 'شفشاون',
        'Essaouira': 'الصويرة',
        'Ifrane': 'إفران',
        'Temara': 'تمارة',
        'Skhirat': 'الصخيرات',
        'Khouribga': 'خريبكة',
        'Beni Mellal': 'بني ملال',
        'Larache': 'العرائش',
        'Tiznit': 'تيزنيت',
        'Ouarzazate': 'ورزازات',
        'Asilah': 'أصيلة',
        'Bouznika': 'بوزنيقة',
        'Martil': 'مرتيل',
        'Berrechid': 'برشيد',
      };
      return arCities[c] || c;
    }
    return c;
  };

  const handleSelect = (city: City | 'all') => {
    onChange(city);
    setIsOpen(false);
    setSearchQuery('');
  };

  return (
    <div className="relative text-left" ref={containerRef}>
      {label && (
        <label className="block text-xs font-bold text-gray-700 dark:text-zinc-300 mb-1 flex items-center gap-1.5 justify-start">
          <MapPin className="w-4 h-4 text-emerald-500" />
          <span>{label}</span>
        </label>
      )}

      {/* Selector Trigger Button */}
      <button
        type="button"
        id="city-selector-trigger"
        onClick={() => setIsOpen(!isOpen)}
        className={`w-full py-3.5 px-4 rounded-2xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-sm font-bold focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none flex items-center justify-between transition-all cursor-pointer shadow-sm ${
          currentLanguage === 'ar' ? 'flex-row-reverse text-right' : 'flex-row text-left'
        }`}
      >
        <div className="flex items-center gap-2">
          <MapPin className="w-4 h-4 text-emerald-500" />
          <span>{getCityLabel(value)}</span>
        </div>
        <ChevronDown className={`w-4 h-4 text-gray-400 transition-transform ${isOpen ? 'rotate-180' : ''}`} />
      </button>

      {/* Floating Dropdown Dialog */}
      {isOpen && (
        <div 
          className={`absolute z-50 mt-1 w-full rounded-2xl border border-gray-150 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-3 shadow-2xl animate-in fade-in slide-in-from-top-2 duration-150 ${
            currentLanguage === 'ar' ? 'right-0' : 'left-0'
          }`}
          style={{ maxHeight: '350px', display: 'flex', flexDirection: 'column' }}
        >
          {/* Search Header */}
          <div className="relative mb-2 shrink-0">
            <input
              type="text"
              autoFocus
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder={t.search_placeholder}
              className={`w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-100 dark:border-zinc-800 bg-gray-50 dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500/10 focus:border-emerald-500 ${
                currentLanguage === 'ar' ? 'text-right' : 'text-left'
              }`}
            />
            <Search className={`w-3.5 h-3.5 text-gray-400 absolute top-1/2 -translate-y-1/2 ${
              currentLanguage === 'ar' ? 'right-3' : 'left-3'
            }`} />
            {searchQuery && (
              <button
                type="button"
                onClick={() => setSearchQuery('')}
                className={`absolute top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-zinc-700 dark:hover:text-zinc-200 ${
                  currentLanguage === 'ar' ? 'left-3' : 'right-3'
                }`}

                <X className="w-3 h-3" />

          </div>

          {/* Popular Cities Quick Bar (only if search is empty) */}
          {!searchQuery && (
            <div className="mb-3 shrink-0 text-right">
              <span className={`block text-[10px] font-black text-gray-400 dark:text-zinc-500 uppercase mb-1.5 ${
                currentLanguage === 'ar' ? 'text-right' : 'text-left'
              }`}>
                {t.popular}
              </span>
              <div className="flex flex-wrap gap-1.5">
                {showAllOption && (
                  <button
                    type="button"
                    onClick={() => handleSelect('all')}
                    className={`px-2.5 py-1 text-[11px] font-extrabold rounded-lg transition-all ${
                      value === 'all'
                        ? 'bg-emerald-500 text-white shadow-sm'
                        : 'bg-gray-100 dark:bg-zinc-900 text-gray-600 dark:text-zinc-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10'
                    }`}
                  >
                    {t.all_morocco}
                  </button>
                )}
                {popularCities.map((c) => (
                  <button
                    type="button"
                    key={c}
                    onClick={() => handleSelect(c)}
                    className={`px-2.5 py-1 text-[11px] font-extrabold rounded-lg transition-all cursor-pointer ${
                      value === c
                        ? 'bg-emerald-500 text-white shadow-sm'
                        : 'bg-gray-100 dark:bg-zinc-900 text-gray-600 dark:text-zinc-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10'
                    }`}
                  >
                    {getCityLabel(c)}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Scrollable Cities List */}
          <div className="overflow-y-auto flex-1 divide-y divide-gray-50 dark:divide-zinc-900/40 text-right max-h-[180px] pr-1">
            {showAllOption && !searchQuery && (
              <button
                type="button"
                onClick={() => handleSelect('all')}
                className={`w-full px-3 py-2 text-xs font-bold text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500/5 flex items-center justify-between rounded-lg transition-colors ${
                  currentLanguage === 'ar' ? 'flex-row-reverse text-right' : 'flex-row text-left'
                }`}
              >
                <span>{t.all_morocco}</span>
                {value === 'all' && <Check className="w-3.5 h-3.5" />}
              </button>
            )}

            {filteredCities.length > 0 ? (
              filteredCities.map((c) => (
                <button
                  type="button"
                  key={c}
                  onClick={() => handleSelect(c)}
                  className={`w-full px-3 py-2 text-xs font-bold text-gray-700 dark:text-zinc-300 hover:bg-gray-100 dark:hover:bg-zinc-900/60 flex items-center justify-between rounded-lg transition-colors cursor-pointer ${
                    currentLanguage === 'ar' ? 'flex-row-reverse text-right' : 'flex-row text-left'
                  }`}
                >
                  <span>{getCityLabel(c)}</span>
                  {value === c && <Check className="w-3.5 h-3.5 text-emerald-500" />}
                </button>
              ))
            ) : (
              <div className="p-4 text-center text-xs text-gray-400 dark:text-zinc-500 font-bold">
                {t.empty}
              </div>
            )}
          </div>
        </div>
      )}

      {error && (
        <span className="text-[10px] text-red-500 font-bold mt-1 block">{error}</span>
      )}
    </div>
  );
}

// ==================== CategoryGrid ====================
const Icons = LucideReact;


interface CategoryGridProps {
  selectedCategory: CategoryId | 'all';
  setSelectedCategory: (cat: CategoryId | 'all') => void;
  currentLanguage: Language;
}

function CategoryGrid({
  selectedCategory,
  setSelectedCategory,
  currentLanguage
}: CategoryGridProps) {
  
  // Resolve Lucide icon component dynamically from string name
  const renderIcon = (iconName: string, active: boolean) => {
    const IconComponent = (Icons as any)[iconName] || Icons.Grid;
    return (
      <IconComponent 
        className={`w-5 h-5 transition-transform duration-300 group-hover:scale-110 ${active ? 'text-white' : 'text-emerald-600 dark:text-emerald-400'}`} 
      />
    );
  };

  const getCategoryName = (cat: Category) => {
    if (currentLanguage === 'ar') return cat.arName;
    if (currentLanguage === 'fr') return cat.frName;
    return cat.enName;
  };

  return (
    <div className="w-full">
      {/* Container with smooth horizontal scrolling on mobile, nice grid on desktop */}
      <div className="flex items-center gap-3 overflow-x-auto pb-4 pt-1 px-1 scrollbar-none snap-x md:flex-wrap md:justify-center">
        
        {/* "All" Category button */}
        <button
          onClick={() => setSelectedCategory('all')}
          className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all duration-300 cursor-pointer flex-shrink-0 snap-start border ${
            selectedCategory === 'all'
              ? 'bg-emerald-600 border-emerald-600 text-white shadow-md shadow-emerald-600/15 scale-[1.02]'
              : 'bg-white dark:bg-zinc-900 border-gray-100 dark:border-zinc-800 text-gray-700 dark:text-zinc-300 hover:border-emerald-500/50 dark:hover:border-emerald-500/50 hover:bg-emerald-50/20 dark:hover:bg-emerald-950/10'
          }`}
        >
          <Icons.Compass className={`w-5 h-5 ${selectedCategory === 'all' ? 'text-white' : 'text-emerald-600 dark:text-emerald-400'}`} />
          <span>{currentLanguage === 'ar' ? 'كل الأقسام' : currentLanguage === 'fr' ? 'Toutes catégories' : 'All Categories'}</span>
        </button>

        {/* Regular categories */}
        {categories.map((cat) => {
          const active = selectedCategory === cat.id;
          return (
            <button
              key={cat.id}
              onClick={() => setSelectedCategory(cat.id)}
              className={`group flex items-center gap-2 px-4 py-2.5 rounded-2xl text-xs font-bold transition-all duration-300 cursor-pointer flex-shrink-0 snap-start border ${
                active
                  ? 'bg-emerald-600 border-emerald-600 text-white shadow-md shadow-emerald-600/15 scale-[1.02]'
                  : 'bg-white dark:bg-zinc-900 border-gray-100 dark:border-zinc-800 text-gray-700 dark:text-zinc-300 hover:border-emerald-500/50 dark:hover:border-emerald-500/50 hover:bg-emerald-50/20 dark:hover:bg-emerald-950/10'
              }`}
            >
              {renderIcon(cat.icon, active)}
              <span>{getCategoryName(cat)}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

            >

                className={`w-full text-left px-4 py-3 rounded-xl text-sm font-bold flex items-center gap-1.5 ${activeTab === 'admin' ? 'bg-amber-500/10 text-amber-500' : 'text-red-500 hover:bg-gray-50 dark:hover:bg-zinc-900'}`}

          <div className="border-t border-gray-100 dark:border-zinc-900 pt-3 flex items-center justify-between">
            <span className="text-[10px] font-bold text-gray-400 dark:text-zinc-500">SIMULATED ROLE:</span>
            <div className="flex gap-1.5">
              {(['user', 'pro', 'admin'] as AccountType[]).map((role) => (
                <button
                  key={role}
                  onClick={() => setUserRole(role)}
                  className={`px-2 py-1 rounded-lg text-[10px] font-bold ${userRole === role ? 'bg-amber-500 text-white' : 'bg-gray-100 dark:bg-zinc-900 text-gray-500'}`}
                >
                  {role === 'user' ? 'Buyer' : role === 'pro' ? 'Pro' : 'Admin'}

              ))}
            </div>
          </div>
        </div>
      )}
    </header>
  );

// ==================== AdCard ====================



interface AdCardProps {
  key?: string;
  ad: Advertisement;
  currentLanguage: Language;
  onSelect: (ad: Advertisement) => void;
  onToggleFavorite: (id: string, e: React.MouseEvent) => void;
  isFavorited: boolean;
}

function AdCard({
  ad,
  currentLanguage,
  onSelect,
  onToggleFavorite,
  isFavorited
}: AdCardProps) {
  const t = translations[currentLanguage];

  const formatPrice = (price: number) => {
    return new Intl.NumberFormat(currentLanguage === 'ar' ? 'ar-MA' : 'fr-MA', {
      maximumFractionDigits: 0
    }).format(price);
  };

  const getConditionBadge = (cond: string) => {
    switch (cond) {
      case 'new':
        return {
          label: t.cond_new,
          icon: <Sparkles className="w-3.5 h-3.5 text-emerald-400" />,
          color: 'bg-emerald-950/90 border-emerald-500/40 text-emerald-300'
        };
      case 'like_new':
        return {
          label: t.cond_like_new,
          icon: <Sparkles className="w-3.5 h-3.5 text-sky-400" />,
          color: 'bg-sky-950/90 border-sky-500/40 text-sky-300'
        };
      case 'good':
        return {
          label: t.cond_good,
          icon: <ThumbsUp className="w-3.5 h-3.5 text-amber-400" />,
          color: 'bg-amber-950/90 border-amber-500/40 text-amber-300'
        };
      default:
        return {
          label: t.cond_fair,
          icon: <RotateCcw className="w-3.5 h-3.5 text-zinc-400" />,
          color: 'bg-zinc-900/90 border-zinc-700/60 text-zinc-300'
        };
    }
  };

  const getCityTranslated = (city: string) => {
    // Standard city name translation can go here, but since names are recognizable:
    return city;
  };

  return (
    <div 
      onClick={() => onSelect(ad)}
      className={`group relative flex flex-col overflow-hidden rounded-3xl bg-white dark:bg-zinc-900 border transition-all duration-300 hover:-translate-y-1.5 cursor-pointer select-none ${
        ad.tier === 'gold' 
          ? 'border-amber-400 dark:border-amber-500/60 shadow-lg hover:shadow-amber-500/10' 
          : ad.tier === 'silver'
          ? 'border-zinc-300 dark:border-zinc-700 shadow-md hover:shadow-zinc-500/10'
          : 'border-gray-100 dark:border-zinc-800 shadow-sm hover:shadow-md'
      }`}
    >
      {/* Visual Badge for Golden & Silver Ads */}
      {ad.tier === 'gold' && (
        <div className="absolute top-3 left-3 z-10 flex items-center gap-1 px-2.5 py-1 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-400 text-zinc-950 text-[10px] font-black tracking-wider uppercase shadow-md animate-pulse">
          <Crown className="w-3.5 h-3.5" />
          <span>{t.ad_tier_gold}</span>
        </div>
      )}
      {ad.tier === 'silver' && (
        <div className="absolute top-3 left-3 z-10 flex items-center gap-1 px-2.5 py-1 rounded-xl bg-gradient-to-r from-zinc-300 to-zinc-400 text-zinc-900 text-[10px] font-black tracking-wider uppercase shadow-md">
          <Award className="w-3.5 h-3.5" />
          <span>{t.ad_tier_silver}</span>
        </div>
      )}

      {/* Favorite / Wishlist Button */}
      <button
        onClick={(e) => onToggleFavorite(ad.id, e)}
        className="absolute top-3 right-3 z-10 p-2 rounded-full bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md text-gray-500 hover:text-red-500 hover:bg-white dark:hover:bg-zinc-900 transition-all active:scale-90"
        title={t.favorite_btn}
      >
        <Heart className={`w-4 h-4 transition-colors ${isFavorited ? 'fill-red-500 text-red-500' : 'text-gray-600 dark:text-gray-300'}`} />
      </button>

      {/* Image Container */}
      <div className="relative aspect-video w-full overflow-hidden bg-gray-100 dark:bg-zinc-800">
        <img
          src={ad.images[0]}
          alt={ad.title}
          referrerPolicy="no-referrer"
          className="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
          loading="lazy"
        />
        {/* Ad condition mini badge with Premium Icons */}
        {(() => {
          const badge = getConditionBadge(ad.condition);
          return (
            <div className={`absolute bottom-3 right-3 px-2 py-1 rounded-xl backdrop-blur-md border flex items-center gap-1.5 text-[10px] font-black uppercase tracking-wider shadow-md ${badge.color}`}>
              {badge.icon}
              <span>{badge.label}</span>
            </div>
          );
        })()}
      </div>

      {/* Content Area */}
      <div className="flex flex-1 flex-col p-4">
        {/* Category & Views */}
        <div className="flex items-center justify-between gap-2 mb-1.5">
          <span className="text-[10px] font-extrabold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">
            {ad.categoryId.replace('_', ' ')}
          </span>
          <div className="flex items-center gap-1 text-[10px] text-gray-400 dark:text-zinc-500">
            <Eye className="w-3 h-3" />
            <span>{ad.views} {t.views}</span>
          </div>
        </div>

        {/* Title */}
        <h3 className="text-sm font-bold text-gray-900 dark:text-white line-clamp-2 leading-tight group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors mb-2 min-h-[2.5rem]">
          {ad.title}
        </h3>

        {/* Price Tag */}
        <div className="mb-3">
          <span className="text-lg font-black text-emerald-600 dark:text-emerald-400">
            {formatPrice(ad.price)}
          </span>
          <span className="text-[10px] font-extrabold text-gray-500 dark:text-zinc-400 ml-1">
            {t.currency}
          </span>
        </div>

        {/* Footer / Location & Seller info */}
        <div className="mt-auto pt-3 border-t border-gray-100 dark:border-zinc-800/60 flex items-center justify-between gap-2">
          
          {/* Location City */}
          <div className="flex items-center gap-1 text-[11px] text-gray-500 dark:text-zinc-400 font-semibold truncate">
            <MapPin className="w-3.5 h-3.5 text-red-500 flex-shrink-0 animate-bounce" />
            <span className="truncate">{getCityTranslated(ad.city)}</span>
          </div>

          {/* Seller short details */}
          <div className="flex items-center gap-1 text-[10px] text-gray-500 dark:text-zinc-400 font-bold flex-shrink-0">
            <Star className="w-3 h-3 text-amber-400 fill-amber-400" />
            <span>{ad.sellerRating}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ==================== AdDetails ====================



interface AdDetailsProps {
  ad: Advertisement;
  onClose: () => void;
  currentLanguage: Language;
  onToggleFavorite: (id: string, e: React.MouseEvent) => void;
  isFavorited: boolean;
  onStartChat: (ad: Advertisement) => void;
}

function AdDetails({
  ad,
  onClose,
  currentLanguage,
  onToggleFavorite,
  isFavorited,
  onStartChat
}: AdDetailsProps) {
  const t = translations[currentLanguage];
  const [activeImageIndex, setActiveImageIndex] = useState(0);
  const [showVideoTab, setShowVideoTab] = useState(false);
  const [copiedLink, setCopiedLink] = useState(false);
  const [showCallModal, setShowCallModal] = useState(false);
  const [showWhatsAppModal, setShowWhatsAppModal] = useState(false);
  const [callStatus, setCallStatus] = useState<'idle' | 'calling' | 'connected'>('idle');

  const formatPrice = (price: number) => {
    return new Intl.NumberFormat(currentLanguage === 'ar' ? 'ar-MA' : 'fr-MA', {
      maximumFractionDigits: 0
    }).format(price);
  };

  const handleShare = () => {
    const mockLink = `${window.location.origin}/ad/${ad.id}`;
    navigator.clipboard.writeText(mockLink).then(() => {
      setCopiedLink(true);
      setTimeout(() => setCopiedLink(false), 2000);
    });
  };

  const handleCall = () => {
    setShowCallModal(true);
    setCallStatus('calling');
    setTimeout(() => {
      setCallStatus('connected');
    }, 1500);
  };

  const handleWhatsApp = () => {
    setShowWhatsAppModal(true);
  };

  const nextImage = () => {
    setActiveImageIndex((prev) => (prev + 1) % ad.images.length);
  };

  const prevImage = () => {
    setActiveImageIndex((prev) => (prev - 1 + ad.images.length) % ad.images.length);
  };

  const getSellerTypeLabel = (type: string) => {
    switch (type) {
      case 'admin': return t.seller_type_admin;
      case 'pro': return t.seller_type_pro;
      case 'company': return t.seller_type_company;
      default: return t.seller_type_user;
    }
  };

  const getConditionBadge = (cond: string) => {
    switch (cond) {
      case 'new':
        return {
          label: t.cond_new,
          icon: <Sparkles className="w-4 h-4 text-emerald-500 animate-pulse" />,
          color: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20'
        };
      case 'like_new':
        return {
          label: t.cond_like_new,
          icon: <Sparkles className="w-4 h-4 text-sky-500" />,
          color: 'bg-sky-500/10 text-sky-600 dark:text-sky-400 border-sky-500/20'
        };
      case 'good':
        return {
          label: t.cond_good,
          icon: <ThumbsUp className="w-4 h-4 text-amber-500" />,
          color: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20'
        };
      default:
        return {
          label: t.cond_fair,
          icon: <RotateCcw className="w-4 h-4 text-zinc-500" />,
          color: 'bg-zinc-500/10 text-zinc-600 dark:text-zinc-400 border-zinc-500/20'
        };
    }
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
      <div className="relative w-full max-w-4xl rounded-3xl bg-white dark:bg-zinc-950 shadow-2xl overflow-hidden border border-gray-100 dark:border-zinc-800 animate-in fade-in zoom-in duration-300">
        
        {/* Top Floating Actions */}
        <div className="absolute top-4 left-4 z-20 flex items-center gap-2">
          <button
            onClick={onClose}
            className="p-2.5 rounded-full bg-black/50 backdrop-blur-md text-white hover:bg-black/70 transition-colors"
            title="Close"
          >
            <X className="w-5 h-5" />
          </button>
        </div>

        <div className="absolute top-4 right-4 z-20 flex items-center gap-2">
          <button
            onClick={handleShare}
            className="p-2.5 rounded-full bg-black/50 backdrop-blur-md text-white hover:bg-black/70 transition-colors relative"
            title={t.share_btn}
          >
            <Share2 className="w-5 h-5" />
            {copiedLink && (
              <span className="absolute bottom-full right-1/2 translate-x-1/2 mb-2 px-2.5 py-1 rounded-lg bg-emerald-600 text-[10px] font-bold text-white whitespace-nowrap shadow-md">
                Link Copied!
              </span>
            )}
          </button>
          <button
            onClick={(e) => onToggleFavorite(ad.id, e)}
            className="p-2.5 rounded-full bg-black/50 backdrop-blur-md text-white hover:bg-black/70 hover:text-red-400 transition-colors"
            title={t.favorite_btn}
          >
            <Heart className={`w-5 h-5 ${isFavorited ? 'fill-red-500 text-red-500' : ''}`} />
          </button>
        </div>

        {/* Content Layout Grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 max-h-[90vh] md:max-h-[85vh] overflow-y-auto">
          
          {/* LEFT: Image Gallery & Simulated Map */}
          <div className="flex flex-col bg-gray-50 dark:bg-zinc-900 border-r border-gray-100 dark:border-zinc-800">
            {/* Gallery Tab Switcher (if video exists) */}
            {ad.videoUrl && (
              <div className="flex bg-gray-100 dark:bg-zinc-900/60 p-1 border-b border-gray-150 dark:border-zinc-800/80">
                <button
                  type="button"
                  onClick={() => setShowVideoTab(false)}
                  className={`flex-1 py-2.5 rounded-2xl text-xs font-black transition-all flex items-center justify-center gap-1.5 cursor-pointer ${
                    !showVideoTab 
                      ? 'bg-white dark:bg-zinc-800 text-emerald-600 dark:text-emerald-400 shadow-sm' 
                      : 'text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200'
                  }`}
                >
                  <Image className="w-4 h-4" />
                  <span>الصور ({ad.images.length}) • Photos</span>
                </button>
                <button
                  type="button"
                  onClick={() => setShowVideoTab(true)}
                  className={`flex-1 py-2.5 rounded-2xl text-xs font-black transition-all flex items-center justify-center gap-1.5 cursor-pointer ${
                    showVideoTab 
                      ? 'bg-white dark:bg-zinc-800 text-emerald-600 dark:text-emerald-400 shadow-sm' 
                      : 'text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200'
                  }`}
                >
                  <Video className="w-4 h-4 text-emerald-500 animate-pulse" />
                  <span>الفيديو • Vidéo</span>
                </button>
              </div>
            )}

            {/* Media Content Box */}
            <div className="relative aspect-video sm:aspect-square md:aspect-[4/3] w-full overflow-hidden bg-black flex items-center justify-center">
              {ad.videoUrl && showVideoTab ? (
                /* Video Player Mode */
                <div className="w-full h-full bg-zinc-950 flex items-center justify-center">
                  {ad.videoUrl.startsWith('blob:') ? (
                    <video 
                      src={ad.videoUrl} 
                      controls 
                      autoPlay 
                      className="w-full h-full object-contain"
                    />
                  ) : (() => {
                    const youtubeRegExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = ad.videoUrl.match(youtubeRegExp);
                    const youtubeId = (match && match[2].length === 11) ? match[2] : null;
                    if (youtubeId) {
                      return (
                        <iframe 
                          src={`https://www.youtube.com/embed/${youtubeId}?autoplay=1`} 
                          title="YouTube Video Player"
                          frameBorder="0"
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowFullScreen
                          className="w-full h-full"
                        />
                      );
                    }
                    return (
                      <div className="p-6 text-center space-y-4">
                        <div className="w-16 h-16 rounded-full bg-emerald-500/15 flex items-center justify-center text-emerald-400 mx-auto animate-bounce">
                          <Video className="w-8 h-8" />
                        </div>
                        <p className="text-xs text-zinc-300 font-bold max-w-xs">
                          {ad.videoUrl}
                        </p>
                        <a 
                          href={ad.videoUrl}

                          مشاهدة الفيديو • Watch External Video
                        </a>
                      </div>
                    );
                  })()}
                </div>
              ) : (
                /* Image Gallery Mode */
                <>
                  <img
                    src={ad.images[activeImageIndex]}
                    alt={ad.title}
                    referrerPolicy="no-referrer"
                    className="h-full w-full object-contain"
                  />

                  {ad.images.length > 1 && (
                    <>
                      <button
                        onClick={prevImage}
                        className="absolute left-3 p-2 rounded-full bg-black/40 text-white hover:bg-black/60 backdrop-blur-sm"
                      >
                        <ArrowLeft className="w-4 h-4" />
                      </button>
                      <button
                        onClick={nextImage}
                        className="absolute right-3 p-2 rounded-full bg-black/40 text-white hover:bg-black/60 backdrop-blur-sm"
                      >
                        <ArrowRight className="w-4 h-4" />
                      </button>
                      {/* Thumbnails indicator bar */}
                      <div className="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 px-4">
                        {ad.images.map((_, idx) => (
                          <button
                            key={idx}
                            onClick={() => setActiveImageIndex(idx)}
                            className={`h-2 rounded-full transition-all ${idx === activeImageIndex ? 'w-5 bg-emerald-500' : 'w-2 bg-white/60'}`}
                          />
                        ))}
                      </div>
                    </>
                  )}
                </>
              )}
            </div>

            {/* Thumbnail selector (only show if not on video tab and has multiple images) */}
            {(!showVideoTab || !ad.videoUrl) && ad.images.length > 1 && (
              <div className="flex gap-2 p-3 overflow-x-auto border-b border-gray-100 dark:border-zinc-800 bg-white dark:bg-zinc-950">
                {ad.images.map((img, idx) => (
                  <button
                    key={idx}
                    onClick={() => setActiveImageIndex(idx)}
                    className={`relative w-16 h-12 rounded-xl overflow-hidden border-2 flex-shrink-0 ${idx === activeImageIndex ? 'border-emerald-500' : 'border-transparent'}`}
                  >
                    <img src={img} alt="" referrerPolicy="no-referrer" className="w-full h-full object-cover" />
                  </button>
                ))}
              </div>
            )}

            {/* GEOGRAPHIC LOCATION MAP SIMULATOR (High craft visual block) */}
            <div className="p-4 bg-white dark:bg-zinc-950">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold text-gray-800 dark:text-gray-200 flex items-center gap-1.5">
                  <Compass className="w-4 h-4 text-emerald-600 dark:text-emerald-400 animate-spin" />
                  الموقع على الخريطة • Carte du site
                </span>
                <span className="text-[10px] text-gray-500 dark:text-zinc-400 font-bold">
                  {ad.city} (GPS: {ad.latitude.toFixed(3)}, {ad.longitude.toFixed(3)})
                </span>
              </div>
              
              {/* Map Canvas Simulation */}
              <div className="relative h-44 rounded-2xl bg-slate-100 dark:bg-zinc-900 overflow-hidden border border-gray-200 dark:border-zinc-800 flex items-center justify-center">
                
                {/* Stylized map pattern (grids, rivers, roads) */}
                <div className="absolute inset-0 opacity-20 dark:opacity-10 pointer-events-none">
                  <div className="absolute top-1/2 left-0 right-0 h-4 bg-amber-500 rotate-12" />
                  <div className="absolute top-0 bottom-0 left-1/3 w-6 bg-blue-500 -rotate-45" />
                  <div className="absolute top-0 bottom-0 right-1/4 w-3 bg-zinc-500" />
                  <div className="w-full h-full border-t border-b border-l border-r border-dashed border-gray-400" style={{ backgroundSize: '24px 24px', backgroundImage: 'radial-gradient(circle, #000 1px, transparent 1px)' }} />

                  <button className="w-6 h-6 rounded bg-white dark:bg-zinc-800 hover:bg-gray-100 text-xs font-extrabold flex items-center justify-center shadow-sm border border-gray-200 dark:border-zinc-700 text-zinc-900 dark:text-zinc-100">-</button>

                {/* Glowing target location pin */}
                <div className="relative z-10 flex flex-col items-center">

                  <MapPin className="w-8 h-8 text-red-500 filter drop-shadow-md animate-bounce" />
                  <span className="mt-1 px-2.5 py-0.5 rounded-lg bg-zinc-900 text-white text-[9px] font-bold shadow-md whitespace-nowrap">
                    {ad.title.slice(0, 20)}...
                  </span>
                </div>
              </div>
              <p className="text-[10px] text-gray-400 dark:text-zinc-500 mt-1.5 text-center leading-tight">
                📍 Location simulation based on verified Morocco postal directories. Safe meeting is advised.
              </p>
            </div>
          </div>

          {/* RIGHT: Ad Details, Price, and Actions */}
          <div className="flex flex-col p-6 overflow-y-auto">
            
            {/* Tag/Category */}
            <div className="flex items-center gap-2 mb-2">
              <span className="px-2.5 py-0.5 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-[10px] font-black uppercase tracking-wider">

              <span className="text-gray-300 dark:text-zinc-700">•</span>
              <span className="text-gray-500 dark:text-zinc-400 text-xs font-semibold flex items-center gap-1">
                <Calendar className="w-3.5 h-3.5" />

              </span>
              <span className="text-gray-300 dark:text-zinc-700">•</span>
              <span className="text-gray-500 dark:text-zinc-400 text-xs font-semibold flex items-center gap-1">
                <Eye className="w-3.5 h-3.5" />
                {ad.views} {t.views}
              </span>
            </div>

            {/* Title */}
            <h2 className="text-xl sm:text-2xl font-black text-gray-900 dark:text-white leading-tight mb-3">
              {ad.title}
            </h2>

            {/* Price section */}

              <div>

              </div>

                "Salam Alaykoum, I am interested in your ad on SouqMaroc: {ad.title} listed at {formatPrice(ad.price)} DH. Is it still available?"

    </div>

}

function PostAdModal({
  onClose,
  currentLanguage,
  onPublish
}: PostAdModalProps) {
  const t = translations[currentLanguage];
  const [step, setStep] = useState(1);
  
  // Form State
  const [categoryId, setCategoryId] = useState<CategoryId>('cars');
  const [title, setTitle] = useState('');
  const [description, setDescription] = useState('');
  const [price, setPrice] = useState<number | ''>('');
  const [condition, setCondition] = useState<'new' | 'like_new' | 'good' | 'fair'>('new');
  const [city, setCity] = useState<City>('Casablanca');
  const [videoUrl, setVideoUrl] = useState('');
  const [phone, setPhone] = useState('+212 6 ');
  const [whatsapp, setWhatsapp] = useState('');
  const [tier, setTier] = useState<AdTier>('normal');

  // Category-specific dynamic states
  const [mileage, setMileage] = useState<number | ''>('');
  const [year, setYear] = useState<number | ''>('');
  const [color, setColor] = useState('');
  const [brand, setBrand] = useState('');
  const [fuelType, setFuelType] = useState('Diesel');
  const [transmission, setTransmission] = useState('Automatique');
  
  const [rooms, setRooms] = useState<number | ''>('');
  const [area, setArea] = useState<number | ''>('');
  const [floor, setFloor] = useState<number | ''>('');
  const [realEstateType, setRealEstateType] = useState('Appartement');
  
  const [storage, setStorage] = useState('128GB');
  
  // Media State for Real Uploads
  const [uploadedMedia, setUploadedMedia] = useState<{ url: string; type: 'image' | 'video'; name: string }[]>([]);
  const [isDragging, setIsDragging] = useState(false);

  const handleFileChange = (e: React.ChangeEvent<HTMLInputElement>) => {
    if (e.target.files) {
      const filesArray = Array.from(e.target.files);
      const newMedia = filesArray.map((file: File) => {
        const isVideo = file.type.startsWith('video/');
        return {
          url: URL.createObjectURL(file),
          type: isVideo ? 'video' as const : 'image' as const,
          name: file.name
        };
      });
      setUploadedMedia(prev => [...prev, ...newMedia].slice(0, 10)); // max 10 files
    }
  };

  const handleDragOver = (e: React.DragEvent) => {
    e.preventDefault();
    setIsDragging(true);
  };

  const handleDragLeave = () => {
    setIsDragging(false);
  };

  const handleDrop = (e: React.DragEvent) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer.files) {
      const filesArray = Array.from(e.dataTransfer.files);
      const newMedia = filesArray.map((file: File) => {
        const isVideo = file.type.startsWith('video/');
        return {
          url: URL.createObjectURL(file),
          type: isVideo ? 'video' as const : 'image' as const,
          name: file.name
        };
      });
      setUploadedMedia(prev => [...prev, ...newMedia].slice(0, 10));
    }
  };

  const removeMediaItem = (index: number) => {
    setUploadedMedia(prev => prev.filter((_, i) => i !== index));
  };
  
  // Checkout Modal State
  const [showPaymentScreen, setShowPaymentScreen] = useState(false);
  const [paymentMethod, setPaymentMethod] = useState<'card' | 'gpay' | 'apay'>('card');
  const [cardNumber, setCardNumber] = useState('');
  const [cardExpiry, setCardExpiry] = useState('');
  const [cardCvv, setCardCvv] = useState('');
  const [paying, setPaying] = useState(false);
  const [paySuccess, setPaySuccess] = useState(false);

  const nextStep = () => setStep((prev) => Math.min(prev + 1, 4));
  const prevStep = () => setStep((prev) => Math.max(prev - 1, 1));

  const getTierPrice = (selectedTier: AdTier) => {
    if (selectedTier === 'gold') return 150;
    if (selectedTier === 'silver') return 50;
    return 0;
  };

  const handlePublishSubmit = () => {
    if (tier === 'normal') {
      finalizePublish();
    } else {
      setShowPaymentScreen(true);
    }
  };

  const finalizePublish = () => {
    // Pick preset images corresponding to categories
    const defaultImages = CATEGORY_IMAGE_PRESETS[categoryId] || [
      'https://images.unsplash.com/photo-1472289065668-ce650ac443d2?auto=format&fit=crop&q=80&w=800'
    ];

    const uploadedImages = uploadedMedia
      .filter((m) => m.type === 'image')
      .map((m) => m.url);
    const uploadedVideo = uploadedMedia.find((m) => m.type === 'video')?.url;

    const finalImages = uploadedImages.length > 0 ? uploadedImages : defaultImages;
    const finalVideo = uploadedVideo || videoUrl || undefined;

    const newAd: Advertisement = {
      id: `ad-${Date.now()}`,
      title: title || `Product of ${categoryId}`,
      description: description || 'No detailed description provided.',
      price: Number(price) || 0,
      categoryId,
      city,
      condition,
      images: finalImages,
      videoUrl: finalVideo,
      createdAt: new Date().toISOString().split('T')[0],
      views: 0,
      tier,
      sellerId: 'user-current',
      sellerName: 'Maryam El Faly',
      sellerType: 'pro',
      sellerRating: 5.0,
      sellerPhone: phone || '+212600112233',
      sellerWhatsApp: whatsapp || '212600112233',
      latitude: 33.5731, // Casablanca default
      longitude: -7.5898,

      // Category specific fields
      ...(categoryId === 'cars' ? {
        mileage: mileage !== '' ? Number(mileage) : undefined,
        year: year !== '' ? Number(year) : undefined,
        color: color || undefined,
        brand: brand || undefined,
        fuelType: fuelType || undefined,
        transmission: transmission || undefined,
      } : {}),
      ...(categoryId === 'real_estate' ? {
        rooms: rooms !== '' ? Number(rooms) : undefined,
        area: area !== '' ? Number(area) : undefined,
        floor: floor !== '' ? Number(floor) : undefined,
        realEstateType: realEstateType || undefined,
      } : {}),
      ...(categoryId === 'phones' || categoryId === 'electronics' ? {
        storage: storage || undefined,
        brand: brand || undefined,
        color: color || undefined,
      } : {}),
    };

    onPublish(newAd);
  };

  const handlePayment = (e: React.FormEvent) => {
    e.preventDefault();
    setPaying(true);
    setTimeout(() => {
      setPaying(false);
      setPaySuccess(true);
      setTimeout(() => {
        setShowPaymentScreen(false);
        finalizePublish();
      }, 1500);
    }, 2000);
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
      <div className="relative w-full max-w-2xl rounded-3xl bg-white dark:bg-zinc-950 shadow-2xl overflow-hidden border border-gray-100 dark:border-zinc-800 animate-in fade-in zoom-in duration-300">
        
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-zinc-800 bg-gray-50/50 dark:bg-zinc-900/40">
          <div>
            <h2 className="text-lg font-black text-gray-900 dark:text-white">
              {t.post_title}
            </h2>
            <span className="text-[10px] font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider">
              Step {step} of 4
            </span>
          </div>
          <button
            onClick={onClose}
            className="p-1.5 rounded-full text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-zinc-800 transition-all"
          >
            <X className="w-5 h-5" />
          </button>
        </div>

        {/* Step Progress Bar */}
        <div className="w-full h-1 bg-gray-100 dark:bg-zinc-900 flex">
          {[1, 2, 3, 4].map((s) => (
            <div 
              key={s} 
              className={`h-full flex-1 transition-all duration-300 ${s <= step ? 'bg-gradient-to-r from-emerald-500 to-emerald-600' : ''}`} 
            />
          ))}
        </div>

        {/* Step Contents */}
        <div className="p-6 max-h-[70vh] overflow-y-auto space-y-4">
          
          {/* STEP 1: Category Selection */}
          {step === 1 && (
            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-3 duration-300">
              <label className="text-xs font-black text-gray-400 dark:text-zinc-500 uppercase tracking-wider block">
                {t.step_cat}
              </label>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                {categories.map((cat) => (
                  <button
                    key={cat.id}
                    onClick={() => setCategoryId(cat.id)}
                    className={`p-4 rounded-2xl border text-center transition-all cursor-pointer flex flex-col items-center justify-center gap-1.5 ${
                      categoryId === cat.id
                        ? 'bg-emerald-500/10 border-emerald-500 text-emerald-600 dark:text-emerald-400 font-bold shadow-sm shadow-emerald-500/10'
                        : 'border-gray-100 dark:border-zinc-800 hover:border-gray-200 dark:hover:border-zinc-700 bg-white dark:bg-zinc-900/40 text-gray-700 dark:text-zinc-300'
                    }`}
                  >
                    <span className="text-xl">
                      {cat.id === 'cars' ? '🚗' : cat.id === 'real_estate' ? '🏠' : cat.id === 'phones' ? '📱' : '📦'}
                    </span>
                    <span className="text-xs">
                      {currentLanguage === 'ar' ? cat.arName : currentLanguage === 'fr' ? cat.frName : cat.enName}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* STEP 2: General Info Form */}
          {step === 2 && (
            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-3 duration-300">
              <h4 className="text-xs font-black text-gray-400 dark:text-zinc-500 uppercase tracking-wider block">
                {t.step_info}
              </h4>

              {/* Title */}

// ==================== ChatWindow ====================



interface ChatWindowProps {
  currentLanguage: Language;
  threads: ChatThread[];
  setThreads: React.Dispatch<React.SetStateAction<ChatThread[]>>;
  activeThreadId: string | null;
  setActiveThreadId: (id: string | null) => void;
}

// Responses based on keywords for simulator feel
const SIMULATED_RESPONSES: Record<string, string[]> = {
  cars: [
    "Salam! Yes, you are welcome to inspect the vehicle in Sidi Maarouf tomorrow morning.",
    "The vehicle has had only one owner and we have the complete maintenance log book.",
    "Would you like to schedule a test drive for tomorrow afternoon? Let me know.",
    "Marhaba! For payment, we accept bank checks, credit transfers, or partial cash."
  ],
  phones: [
    "Hi there, yes it is completely brand new in box with the original seal unbroken.",
    "Sure, let's meet at Rabat Ville station today around 5:30 PM. Does that work?",
    "I can give you a discount of 200 DH, but that is my absolute final price.",
    "We can meet in a public cafe near the station so you can inspect everything calmly."
  ],
  default: [
    "Salam Alaykoum! Thank you for your interest. Let me check the details and I will reply soon.",
    "Yes, it is still available. Feel free to ask any specific questions!",
    "Are you located in the same city? We can arrange a quick meeting today.",
    "Perfect! Please leave your WhatsApp number so we can coordinate the delivery."
  ]
};

function ChatWindow({
  currentLanguage,
  threads,
  setThreads,
  activeThreadId,
  setActiveThreadId
}: ChatWindowProps) {
  const t = translations[currentLanguage];
  const [inputText, setInputText] = useState('');
  const [playingVoiceId, setPlayingVoiceId] = useState<string | null>(null);
  const messagesEndRef = useRef<HTMLDivElement>(null);

  // Auto scroll to bottom
  const scrollToBottom = () => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  };

  useEffect(() => {
    scrollToBottom();
  }, [activeThreadId, threads]);

  const activeThread = threads.find(thread => thread.id === activeThreadId);

  // Trigger automated replies
  const handleSendMessage = (textToSend?: string, mediaType?: 'image' | 'location' | 'voice') => {
    if (!activeThreadId || (!inputText.trim() && !textToSend)) return;

    const actualText = textToSend || inputText;
    const newMessage: ChatMessage = {
      id: `msg-user-${Date.now()}`,
      senderId: 'user-current',
      text: mediaType ? undefined : actualText,
      imageUrl: mediaType === 'image' ? 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=600' : undefined,
      location: mediaType === 'location' ? { latitude: 33.5731, longitude: -7.5898, name: 'Sidi Maarouf, Casablanca' } : undefined,
      voiceUrl: mediaType === 'voice' ? 'simulated_audio.mp3' : undefined,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      read: true
    };

    // Update Local state instantly
    setThreads(prev => prev.map(th => {
      if (th.id === activeThreadId) {
        return {
          ...th,
          lastMessage: mediaType ? `Sent ${mediaType}` : actualText,
          lastTimestamp: newMessage.timestamp,
          messages: [...th.messages, newMessage]
        };
      }
      return th;
    }));

    if (!textToSend) setInputText('');

    // Trigger Simulated Seller Auto-Response sequence
    const currentAdId = activeThread?.adId || '';
    const isCarAd = currentAdId.includes('ad-1') || activeThread?.adTitle.toLowerCase().includes('golf');
    const isPhoneAd = currentAdId.includes('ad-3') || activeThread?.adTitle.toLowerCase().includes('iphone');
    
    let pool = SIMULATED_RESPONSES.default;
    if (isCarAd) pool = SIMULATED_RESPONSES.cars;
    else if (isPhoneAd) pool = SIMULATED_RESPONSES.phones;

    // Simulate typing
    setTimeout(() => {
      setThreads(prev => prev.map(th => {
        if (th.id === activeThreadId) {
          return { ...th, isTyping: true };
        }
        return th;
      }));

      // Simulate sending reply after typing
      setTimeout(() => {
        const randomReply = pool[Math.floor(Math.random() * pool.length)];
        const replyMessage: ChatMessage = {
          id: `msg-seller-${Date.now()}`,
          senderId: activeThread?.sellerId || 'seller-generic',
          text: randomReply,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          read: false
        };

        setThreads(prev => prev.map(th => {
          if (th.id === activeThreadId) {
            return {
              ...th,
              isTyping: false,
              lastMessage: randomReply,
              lastTimestamp: replyMessage.timestamp,
              messages: [...th.messages, replyMessage]
            };
          }
          return th;
        }));
      }, 2000);

    }, 1000);
  };

  const toggleVoicePlay = (msgId: string) => {
    setPlayingVoiceId(prev => prev === msgId ? null : msgId);
  };

  return (
    <div className="flex rounded-3xl border border-gray-100 dark:border-zinc-800 bg-white dark:bg-zinc-950 shadow-xl overflow-hidden h-[75vh] max-h-[800px]">
      
      {/* THREADS LISTING (Hidden on active thread in mobile) */}
      <div className={`w-full md:w-80 border-r border-gray-100 dark:border-zinc-900 flex flex-col ${activeThreadId ? 'hidden md:flex' : 'flex'}`}>
        <div className="p-4 border-b border-gray-100 dark:border-zinc-900 bg-gray-50/50 dark:bg-zinc-900/10">
          <h3 className="font-black text-sm text-gray-900 dark:text-white uppercase tracking-wider">
            {t.chat_title}
          </h3>
        </div>

        <div className="flex-1 overflow-y-auto divide-y divide-gray-50 dark:divide-zinc-900/60 p-2 space-y-1">
          {threads.map((thread) => {
            const active = thread.id === activeThreadId;
            const unreadCount = thread.messages.filter(m => m.senderId !== 'user-current' && !m.read).length;
            return (
              <div
                key={thread.id}
                onClick={() => setActiveThreadId(thread.id)}
                className={`p-3 rounded-2xl flex items-center gap-3 cursor-pointer transition-all ${active ? 'bg-emerald-500/10 border-emerald-500/20 shadow-sm' : 'hover:bg-gray-50 dark:hover:bg-zinc-900/40'}`}
              >
                {/* Ad Image Thumbnail */}
                <div className="relative w-12 h-12 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0">
                  <img src={thread.adImage} alt="" referrerPolicy="no-referrer" className="w-full h-full object-cover" />
                </div>

                {/* Content */}
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between mb-0.5">
                    <span className="text-xs font-black text-gray-900 dark:text-white truncate">
                      {thread.sellerName}
                    </span>
                    <span className="text-[9px] text-gray-400 dark:text-zinc-500 font-bold">
                      {thread.lastTimestamp}
                    </span>
                  </div>
                  <p className="text-[10px] text-emerald-600 dark:text-emerald-400 font-extrabold mb-1">
                    {thread.adTitle}
                  </p>
                  <p className="text-[11px] text-gray-500 dark:text-zinc-400 truncate leading-snug">
                    {thread.lastMessage}
                  </p>
                </div>

                {/* Unread badge / status indicator */}
                {unreadCount > 0 && (
                  <span className="w-5 h-5 rounded-full bg-red-500 flex items-center justify-center text-[10px] font-black text-white flex-shrink-0">
                    {unreadCount}
                  </span>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* CHAT WINDOW CANVAS */}
      {activeThread ? (
        <div className="flex-1 flex flex-col bg-slate-50/50 dark:bg-zinc-950/40">
          
          {/* Active Header */}
          <div className="px-4 py-3.5 border-b border-gray-100 dark:border-zinc-900 bg-white dark:bg-zinc-950 flex items-center gap-3">
            {/* Mobile Back Button */}
            <button 
              onClick={() => setActiveThreadId(null)} 
              className="p-1.5 rounded-xl border border-gray-100 dark:border-zinc-900 text-gray-500 hover:text-zinc-900 dark:hover:text-white md:hidden"
            >
              <ArrowLeft className="w-4 h-4" />
            </button>

            <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 to-emerald-400 flex items-center justify-center text-white font-extrabold text-sm">
              {activeThread.sellerName.slice(0, 2).toUpperCase()}
            </div>
            <div>
              <h4 className="text-xs sm:text-sm font-black text-gray-900 dark:text-white leading-tight">
                {activeThread.sellerName}
              </h4>
              <div className="flex items-center gap-1.5 mt-0.5">
                <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse" />
                <span className="text-[9px] font-bold text-gray-400 dark:text-zinc-500 uppercase tracking-wider">
                  {t.chat_online} • Online
                </span>
              </div>
            </div>

            {/* Ad Short detail overlay */}
            <div className="ml-auto text-right hidden sm:block max-w-[200px] bg-gray-50 dark:bg-zinc-900 p-2 rounded-xl border border-gray-100 dark:border-zinc-800">
              <span className="text-[9px] text-gray-400 dark:text-zinc-500 uppercase font-bold block truncate">{activeThread.adTitle}</span>
              <span className="text-xs font-black text-emerald-600 dark:text-emerald-400">{activeThread.adPrice.toLocaleString()} DH</span>
            </div>
          </div>

          {/* Messages Flow Container */}
          <div className="flex-1 overflow-y-auto p-4 space-y-3.5">
            {activeThread.messages.map((msg) => {
              const isMe = msg.senderId === 'user-current';
              return (
                <div 
                  key={msg.id}
                  className={`flex w-full ${isMe ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2 duration-200`}
                >
                  <div className={`max-w-[75%] rounded-3xl p-3.5 shadow-sm text-xs leading-relaxed ${isMe ? 'bg-emerald-600 text-white rounded-tr-none' : 'bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 text-gray-800 dark:text-gray-100 rounded-tl-none'}`}>
                    
                    {/* Render Image message */}
                    {msg.imageUrl && (
                      <div className="rounded-xl overflow-hidden mb-1.5 max-w-xs aspect-video bg-zinc-800">
                        <img src={msg.imageUrl} alt="" referrerPolicy="no-referrer" className="w-full h-full object-cover" />
                      </div>
                    )}

                    {/* Render Location message */}
                    {msg.location && (
                      <div className="rounded-2xl overflow-hidden mb-1.5 border border-gray-200 dark:border-zinc-700 bg-slate-100 dark:bg-zinc-850 p-2.5 max-w-xs flex flex-col gap-1.5 text-[11px] text-zinc-900 dark:text-zinc-100 font-bold">
                        <div className="flex items-center gap-1.5 text-red-500">
                          <MapPin className="w-4 h-4 animate-bounce" />
                          <span>Shared Location:</span>
                        </div>
                        <span className="text-gray-500 dark:text-zinc-400 text-[10px]">{msg.location.name}</span>
                        <div className="h-20 bg-emerald-500/5 rounded-xl border border-emerald-500/10 flex items-center justify-center font-bold text-emerald-600 text-[10px]">
                          📍 Real GPS Map Pin
                        </div>
                      </div>
                    )}

                    {/* Render Voice Message */}
                    {msg.voiceUrl && (
                      <div className="flex items-center gap-3 py-1 px-2.5 rounded-2xl bg-black/5 dark:bg-white/5 min-w-[200px]">
                        <button
                          onClick={() => toggleVoicePlay(msg.id)}
                          className="p-2 rounded-full bg-emerald-500 text-white hover:bg-emerald-600 transition-colors"
                        >
                          {playingVoiceId === msg.id ? <Pause className="w-3.5 h-3.5" /> : <Play className="w-3.5 h-3.5 fill-white" />}
                        </button>
                        <div className="flex-1 space-y-1">
                          <div className="h-1 bg-gray-300 dark:bg-zinc-700 rounded-full w-full overflow-hidden">
                            <div className={`h-full bg-emerald-500 rounded-full ${playingVoiceId === msg.id ? 'w-full transition-all duration-5000' : 'w-1/3'}`} />
                          </div>
                          <span className="text-[9px] text-gray-400 dark:text-zinc-500 block font-bold">Voice Note (0:12s)</span>
                        </div>
                      </div>
                    )}

                    {/* Render Text message */}
                    {msg.text && (
                      <p className="whitespace-pre-line text-[12px] md:text-[13px]">{msg.text}</p>
                    )}

                    {/* Timestamp & Checks */}
                    <div className="flex items-center justify-end gap-1 mt-1.5 text-[9px] text-gray-400 dark:text-zinc-500">
                      <span>{msg.timestamp}</span>
                      {isMe && <CheckCheck className="w-3.5 h-3.5 text-emerald-500" />}
                    </div>

                  </div>
                </div>
              );
            })}

            {/* Simulated typing dot-animation */}
            {activeThread.isTyping && (
              <div className="flex justify-start">
                <div className="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 rounded-2xl px-4 py-2 flex items-center gap-1 shadow-sm text-xs text-gray-500 font-bold">
                  <span>{t.chat_typing}</span>
                  <div className="flex gap-1">
                    <span className="w-1.5 h-1.5 bg-gray-400 dark:bg-zinc-600 rounded-full animate-bounce delay-100" />
                    <span className="w-1.5 h-1.5 bg-gray-400 dark:bg-zinc-600 rounded-full animate-bounce delay-200" />
                    <span className="w-1.5 h-1.5 bg-gray-400 dark:bg-zinc-600 rounded-full animate-bounce delay-300" />
                  </div>
                </div>
              </div>
            )}

            <div ref={messagesEndRef} />
          </div>

          {/* Chat bottom message Composer */}
          <div className="p-3 bg-white dark:bg-zinc-950 border-t border-gray-100 dark:border-zinc-900 flex items-center gap-2">
            
            {/* Actions panel */}
            <div className="flex items-center gap-1.5">
              <button 
                onClick={() => handleSendMessage('Sent photo', 'image')}
                className="p-2 rounded-xl text-gray-400 hover:text-emerald-600 hover:bg-gray-50 dark:hover:bg-zinc-900 transition-colors"
                title={t.chat_send_image}
              >
                <Image className="w-4.5 h-4.5" />
              </button>
              <button 
                onClick={() => handleSendMessage('Shared location', 'location')}
                className="p-2 rounded-xl text-gray-400 hover:text-emerald-600 hover:bg-gray-50 dark:hover:bg-zinc-900 transition-colors"
                title={t.chat_send_location}
              >
                <MapPin className="w-4.5 h-4.5" />
              </button>
              <button 
                onClick={() => handleSendMessage('Sent a voice note', 'voice')}
                className="p-2 rounded-xl text-gray-400 hover:text-emerald-600 hover:bg-gray-50 dark:hover:bg-zinc-900 transition-colors animate-pulse"
                title={t.chat_send_voice}
              >
                <Mic className="w-4.5 h-4.5 text-amber-500" />
              </button>
            </div>

            {/* Input field */}
            <div className="flex-1 relative">
              <input
                type="text"
                value={inputText}
                onChange={(e) => setInputText(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') handleSendMessage(); }}
                placeholder={t.chat_placeholder}
                className="w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 text-gray-850 dark:text-zinc-100 text-xs sm:text-sm focus:border-emerald-500 outline-none pr-10"
              />
              <button className="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-zinc-600">
                <Smile className="w-4 h-4" />
              </button>
            </div>

            {/* Send btn */}
            <button
              onClick={() => handleSendMessage()}
              className="p-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white transition-all active:scale-95 flex items-center justify-center shadow-md shadow-emerald-600/10"
            >
              <Send className="w-4 h-4" />
            </button>

          </div>

        </div>
      ) : (
        /* Empty State */
        <div className="flex-1 hidden md:flex flex-col items-center justify-center text-center p-6 bg-slate-50/50 dark:bg-zinc-950/20">
          <div className="w-16 h-16 rounded-3xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 mb-3 text-2xl">
            💬
          </div>
          <h4 className="font-extrabold text-sm text-gray-900 dark:text-white">
            {currentLanguage === 'ar' ? 'اختر محادثة للبدء' : currentLanguage === 'fr' ? 'Sélectionnez un fil pour chatter' : 'Select a thread to start chatting'}
          </h4>
          <p className="text-[11px] text-gray-400 dark:text-zinc-500 mt-1 max-w-xs">
            Connect instantly with sellers from Casablanca, Rabat, Marrakech, and beyond. Fast secure trading starts here.
          </p>
        </div>
      )}

    </div>
  );
}

              <h4 className="font-extrabold text-md text-gray-900 dark:text-white">Edit Profile Settings</h4>

              >
                <X className="w-4 h-4" />
              </button>
            </div>

            <div className="space-y-3 text-left">
              <div>
                <label className="block text-[10px] font-bold text-gray-400 dark:text-zinc-500 uppercase mb-1">Full Name</label>
                <input 
                  required
                  type="text" 
                  value={profileName}
                  onChange={(e) => setProfileName(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-xs focus:border-emerald-500 outline-none"
                />
              </div>

              <div>
                <CitySelector 
                  value={profileCity}
                  onChange={(val) => setProfileCity(val === 'all' ? 'Casablanca' : val)}
                  currentLanguage={currentLanguage}
                  label="Primary City"
                />
              </div>

              <div>
                <label className="block text-[10px] font-bold text-gray-400 dark:text-zinc-500 uppercase mb-1">Contact Phone</label>
                <input 
                  required
                  type="text" 
                  value={profilePhone}
                  onChange={(e) => setProfilePhone(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 text-gray-800 dark:text-zinc-100 text-xs focus:border-emerald-500 outline-none"
                />
              </div>
            </div>

            <button
              type="submit"
              className="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition-all active:scale-98 shadow-md"
            >
              Save Profile Configuration
            </button>
          </form>
        </div>
      )}

    </div>
  );
}

    }).format(price);

  const handleResolveReport = (reportId: string, action: 'dismiss' | 'resolve') => {
    setReports(prev => prev.map(rep => {
      if (rep.id === reportId) {
        return { ...rep, status: action === 'dismiss' ? 'dismissed' : 'resolved' };
      }
      return rep;
    }));

    if (action === 'resolve') {

      const rep = reports.find(r => r.id === reportId);
      if (rep) {
        setAds(prev => prev.filter(ad => ad.id !== rep.adId));
      }
    }
  };
